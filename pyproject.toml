[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-day-planner"
version = "0.1.0"
description = "Local-first multi-agent day planner: LangGraph + OR-Tools CP-SAT + pgvector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ortools>=9.11",
    "langgraph>=0.2",
    "ollama>=0.3",
    "groq>=0.11",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "icalendar>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]